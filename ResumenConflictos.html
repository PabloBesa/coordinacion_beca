<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumen de Conflictos — Traumatología UC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root{--navy:#30579b;--navy-mid:#264a86;--tmt:#30579b;--tmt-light:#7f9fd0;--tmt-pale:#e8eef7;
    --gold:#c8973a;--gold-light:#e8c47a;--gold-pale:#f5e9cc;
    --cream:#f6f8fb;--warm-gray:#eef1f6;--text:#22303f;--text-muted:#5d6b7a;--border:#cfd8e6;
    --green:#2a6041;--green-light:#e8f2ec;--red:#8b2e2e;--red-light:#f5eaea;--purple:#4a3b6b;--purple-light:#ece8f5;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Source Serif 4',Georgia,serif;background:var(--cream);color:var(--text);font-size:15px;line-height:1.7;}
  .page{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;}

  .header{background:#fff;padding:20px 20px 16px;border-bottom:2px solid var(--tmt);display:flex;align-items:center;gap:14px;}
  .header .logo{width:54px;height:auto;flex-shrink:0;}
  .header-tag{font-size:9px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--tmt-light);margin-bottom:3px;}
  .header h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--tmt);line-height:1.15;}
  .header-sub{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:2px;}

  .content{padding:22px 20px 60px;}

  .summary{background:var(--navy);border-radius:10px;padding:16px 18px;margin-bottom:20px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .summary .st{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;}
  .summary .ss{font-size:11px;color:rgba(255,255,255,.7);font-style:italic;margin-top:2px;}
  .summary button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:20px;padding:7px 14px;font-family:'Source Serif 4',serif;font-size:11.5px;cursor:pointer;}
  .summary button:hover{background:rgba(255,255,255,.22);}

  .empty{text-align:center;padding:50px 20px;color:var(--text-muted);font-style:italic;font-size:13.5px;line-height:1.6;}
  .loading{text-align:center;padding:50px 20px;color:var(--text-muted);font-style:italic;font-size:13px;}

  /* modo presentación */
  .stage{display:none;}
  .stage.active{display:block;}
  .navrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .navrow .counter{font-size:11px;color:var(--text-muted);font-style:italic;letter-spacing:.3px;}
  .navrow .navbtns{display:flex;gap:8px;}
  .navbtn{background:var(--cream);border:1px solid var(--border);border-radius:20px;padding:7px 16px;
    font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;}
  .navbtn:hover{border-color:var(--tmt);}
  .navbtn:disabled{opacity:.35;cursor:default;}

  .ccard{background:var(--red-light);border:1.5px solid #e0bcbc;border-radius:12px;padding:20px 20px 18px;}
  .ctag{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);margin-bottom:8px;}
  .cmod{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--navy);}
  .csub{font-size:11px;color:var(--text-muted);font-style:italic;margin-bottom:12px;}
  .ctext{font-size:15.5px;line-height:1.6;color:var(--text);margin-bottom:14px;}
  .cmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .chip{background:#fff;border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11.5px;color:var(--text);}
  .chip b{font-family:'Playfair Display',serif;color:var(--navy);}
  .chip.lvl{font-family:'Playfair Display',serif;font-weight:700;}
  .chip.lvl.r1{color:var(--green);border-color:var(--green);}
  .chip.lvl.r2{color:#8a6420;border-color:var(--gold);}
  .chip.lvl.r3{color:var(--navy);border-color:var(--navy);}
  .chip.lvl.rf{color:#fff;background:var(--purple);border-color:var(--purple);}
  .ccmt{background:#fff;border-radius:8px;padding:11px 13px;font-size:13px;font-style:italic;color:var(--text);border:1px solid var(--border);}
  .ccmt.empty2{color:var(--text-muted);}

  /* lista completa */
  .listhead{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--tmt);
    margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
  .lmod{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--navy);margin:16px 0 8px;}
  .lrow{background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
  .lrow:hover{border-color:var(--tmt);}
  .lrow .lt{font-size:12.5px;color:var(--text);line-height:1.5;}
  .lrow .lm{font-size:10.5px;color:var(--text-muted);font-style:italic;margin-top:4px;}

  .footer{text-align:center;font-size:10.5px;color:var(--text-muted);font-style:italic;padding:20px 20px 34px;}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <img class="logo" src="logo_tmt_mark.png" alt="Traumatología y Ortopedia UC">
    <div>
      <div class="header-tag">Resumen de Conflictos</div>
      <h1>Traumatología y Ortopedia</h1>
      <div class="header-sub">Temas marcados conflictivos, para revisar en equipo</div>
    </div>
  </div>

  <div class="content" id="body">
    <div class="loading">Cargando temas conflictivos…</div>
  </div>

  <div class="footer">
    Revisión del Temario · Programa de Posgrado Traumatología UC<br>
    Coordinación docente
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxDYN-zZdynKVQF5qoOocCNuufTtlHOSOkj3GmKuIMapqHNAJh7mZJVGs_m1AYpeLeq/exec';

const MODULOS = {
  adulto:{nombre:'Adulto general y trauma'},
  hombro:{nombre:'Hombro'},
  columna:{nombre:'Columna'},
  cadera:{nombre:'Cadera'},
  rodilla:{nombre:'Rodilla'},
  eess:{nombre:'Mano, muñeca, codo y brazo'},
  typ:{nombre:'Tobillo y pie'},
  tumores:{nombre:'Tumores'},
  infantil:{nombre:'Infantil'},
  investigacion:{nombre:'Investigación'}
};
const LVL_LABEL = {R1:'R1', R2:'R2', R3:'R3', F:'Fellow'};

let DATA = {};
let CONFLICTS = [];
let idx = 0;

const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb = 'cb_'+Math.random().toString(36).slice(2);
    const t = setTimeout(()=>{ cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; if(sc.parentNode) sc.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    const qs = Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const sc = document.createElement('script');
    sc.src = API+'?'+qs+'&callback='+cb;
    sc.onerror = ()=>{ cleanup(); reject(new Error('network')); };
    document.body.appendChild(sc);
  });
}

function buscarTema(modulo, temaId){
  const m = DATA[modulo]; if(!m) return null;
  for(const ss of m.subsecciones){
    const t = ss.temas.find(x=>x.id===temaId);
    if(t) return {tema:t, subseccion:ss.nombre};
  }
  return null;
}

async function cargar(){
  $('#body').innerHTML = '<div class="loading">Cargando temas conflictivos…</div>';
  try{
    const r = await fetch('temario.json');
    DATA = await r.json();
  }catch(e){
    $('#body').innerHTML = '<div class="empty">No pude cargar <b>temario.json</b>.<br>Debe estar en la misma carpeta que esta página.</div>';
    return;
  }
  let marcas = {};
  try{
    const d = await jsonp({});
    marcas = (d && d.marcas) ? d.marcas : {};
  }catch(e){
    $('#body').innerHTML = '<div class="empty">No pude conectarme al backend. Revisa tu conexión e inténtalo de nuevo.</div>';
    return;
  }

  CONFLICTS = Object.values(marcas)
    .filter(m => m.accion === 'revision' && m.conflictivo)
    .map(m => {
      const info = buscarTema(m.modulo, m.tema_id);
      return {
        modulo: m.modulo,
        moduloNombre: (MODULOS[m.modulo] || {}).nombre || m.modulo,
        subseccion: info ? info.subseccion : '—',
        tema: info ? info.tema.t : '(tema no encontrado en temario.json — id ' + esc(m.tema_id) + ')',
        revisor: m.revisor,
        nivel_propuesto: m.nivel_propuesto,
        comentario: m.comentario
      };
    })
    .sort((a,b)=> a.moduloNombre.localeCompare(b.moduloNombre) || a.subseccion.localeCompare(b.subseccion));

  idx = 0;
  render();
}

function render(){
  if(CONFLICTS.length === 0){
    $('#body').innerHTML = `<div class="empty">Aún no hay temas marcados como conflictivos.<br><br>
      A medida que cada revisor use la Revisión del Temario y marque desacuerdos, aparecerán aquí
      agrupados para resolverlos en conjunto.</div>
      <button class="navbtn" style="width:100%;margin-top:18px" id="refreshBtn">↻ Actualizar</button>`;
    $('#refreshBtn').onclick = cargar;
    return;
  }

  const mods = new Set(CONFLICTS.map(c=>c.moduloNombre));
  let html = `<div class="summary">
    <div><div class="st">${CONFLICTS.length} conflicto${CONFLICTS.length>1?'s':''}</div>
    <div class="ss">en ${mods.size} módulo${mods.size>1?'s':''}</div></div>
    <button id="refreshBtn">↻ Actualizar</button></div>`;

  html += `<div class="stage active" id="stage"></div>`;

  html += `<div class="listhead">Todos los conflictos</div>`;
  let lastMod = null;
  CONFLICTS.forEach((c,i)=>{
    if(c.moduloNombre !== lastMod){ lastMod = c.moduloNombre; html += `<div class="lmod">${esc(c.moduloNombre)}</div>`; }
    html += `<div class="lrow" data-i="${i}">
      <div class="lt">${esc(c.tema)}</div>
      <div class="lm">${esc(c.subseccion)} · marcado por ${esc(c.revisor)}</div>
    </div>`;
  });

  $('#body').innerHTML = html;
  $('#refreshBtn').onclick = cargar;
  $('#body').addEventListener('click', e=>{
    const row = e.target.closest('.lrow'); if(!row) return;
    idx = Number(row.dataset.i);
    renderStage();
    $('#stage').scrollIntoView({behavior:'smooth', block:'start'});
  });
  renderStage();
}

function renderStage(){
  const c = CONFLICTS[idx];
  const lvl = (c.nivel_propuesto||'').toLowerCase() === 'f' ? 'rf' : (c.nivel_propuesto||'').toLowerCase();
  $('#stage').innerHTML = `
    <div class="navrow">
      <span class="counter">Conflicto ${idx+1} de ${CONFLICTS.length}</span>
      <div class="navbtns">
        <button class="navbtn" id="prevBtn" ${idx===0?'disabled':''}>‹ Anterior</button>
        <button class="navbtn" id="nextBtn" ${idx===CONFLICTS.length-1?'disabled':''}>Siguiente ›</button>
      </div>
    </div>
    <div class="ccard">
      <div class="ctag">Conflictivo</div>
      <div class="cmod">${esc(c.moduloNombre)}</div>
      <div class="csub">${esc(c.subseccion)}</div>
      <div class="ctext">${esc(c.tema)}</div>
      <div class="cmeta">
        <span class="chip">Marcado por <b>${esc(c.revisor)}</b></span>
        ${c.nivel_propuesto ? `<span class="chip lvl ${lvl}">Propone ${LVL_LABEL[c.nivel_propuesto]||esc(c.nivel_propuesto)}</span>` : ''}
      </div>
      <div class="ccmt ${c.comentario?'':'empty2'}">${c.comentario ? esc(c.comentario) : 'Sin comentario.'}</div>
    </div>`;
  $('#prevBtn').onclick = ()=>{ if(idx>0){ idx--; renderStage(); } };
  $('#nextBtn').onclick = ()=>{ if(idx<CONFLICTS.length-1){ idx++; renderStage(); } };
}

cargar();
</script>
</body>
</html>
